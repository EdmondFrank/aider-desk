name: PR Check

on:
  pull_request:

# Skip the onnxruntime-node CUDA EP download at install time (embeddings run on CPU,
# and the upstream release asset may be unavailable - see scripts/before-pack.js)
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  validate:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint:check

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test
